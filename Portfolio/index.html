    <script>
        // Main Hamburger Menu Toggle Logic (Fixed layout display logic)
        const mainBtn = document.getElementById('main-menu-btn');
        const mainMenu = document.getElementById('main-menu');
        const hamburgerIcon = document.getElementById('hamburger-icon');

        mainBtn.addEventListener('click', () => {
            if (mainMenu.classList.contains('hidden')) {
                mainMenu.classList.replace('hidden', 'flex'); // Ensures flexbox layout works
                setTimeout(() => mainMenu.classList.remove('opacity-0'), 10);
                hamburgerIcon.classList.add('hamburger-active');
            } else {
                mainMenu.classList.add('opacity-0');
                setTimeout(() => {
                    mainMenu.classList.replace('flex', 'hidden');
                }, 300);
                hamburgerIcon.classList.remove('hamburger-active');
            }
        });

        // Lightbox Gallery Navigation
        const photoElements = Array.from(document.querySelectorAll('.grid img'));
        const photoSources = photoElements.map(img => img.src);
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');
        let currentPhotoIndex = 0;

        const isTouchDevice = window.matchMedia('(hover: none) and (pointer: coarse)').matches;
        if (isTouchDevice && 'IntersectionObserver' in window) {
            const mobilePhotoObserver = new IntersectionObserver((entries) => {
                entries.forEach((entry) => {
                    entry.target.classList.toggle('mobile-in-view', entry.intersectionRatio >= 0.65);
                });
            }, { threshold: 0.65 });

            photoElements.forEach((photo) => {
                mobilePhotoObserver.observe(photo);
            });
        }

        function openLightbox(index) {
            currentPhotoIndex = index;
            lightboxImg.src = photoSources[currentPhotoIndex];
            lightbox.classList.replace('hidden', 'flex'); // Fixes lightbox centering
            setTimeout(() => lightbox.classList.remove('opacity-0'), 10);
            document.body.style.overflow = 'hidden';
        }

        function closeLightbox() {
            lightbox.classList.add('opacity-0');
            setTimeout(() => {
                lightbox.classList.replace('flex', 'hidden');
                lightboxImg.src = '';
            }, 300);
            document.body.style.overflow = 'auto';
        }

        function navigateLightbox(direction) {
            currentPhotoIndex = (currentPhotoIndex + direction + photoSources.length) % photoSources.length;
            lightboxImg.style.opacity = '0.5';
            setTimeout(() => {
                lightboxImg.src = photoSources[currentPhotoIndex];
                lightboxImg.style.opacity = '1';
            }, 100);
        }

        // Close when clicking directly on background backdrop
        lightbox.addEventListener('click', (e) => {
            if (e.target === lightbox) {
                closeLightbox();
            }
        });

        // Keyboard Controls (Esc, Left Arrow, Right Arrow)
        document.addEventListener('keydown', (e) => {
            if (lightbox.classList.contains('hidden')) return;
            
            if (e.key === 'Escape') {
                closeLightbox();
            } else if (e.key === 'ArrowLeft') {
                navigateLightbox(-1);
            } else if (e.key === 'ArrowRight') {
                navigateLightbox(1);
            }
        });
    </script>
