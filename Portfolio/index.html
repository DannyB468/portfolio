<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="danny.png">
    <title>Danny's Visuals</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Cormorant Garamond', serif; }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-50 antialiased h-screen overflow-hidden flex flex-col justify-center items-center relative">

    <!-- Header / Hamburger Button -->
    <header class="absolute top-0 w-full p-8 flex justify-between items-center z-50">
        <a href="index.html" class="text-2xl tracking-widest uppercase">Danny.</a>
        <button id="menu-btn" class="text-lg tracking-widest uppercase hover:text-zinc-400 transition-colors focus:outline-none">
            Menu
        </button>
    </header>

    <!-- Fullscreen Main Menu Overlay -->
    <div id="main-menu" class="fixed inset-0 bg-zinc-950/95 backdrop-blur-sm z-40 hidden flex-col justify-center items-center space-y-8 opacity-0 transition-opacity duration-300">
        <a href="photography.html" class="text-4xl md:text-6xl tracking-widest hover:text-zinc-400 transition-colors">Photography</a>
        <a href="videography.html" class="text-4xl md:text-6xl tracking-widest hover:text-zinc-400 transition-colors">Videography</a>
        <a href="about.html" class="text-4xl md:text-6xl tracking-widest hover:text-zinc-400 transition-colors">About</a>
    </div>

    <!-- Minimalist Centerpiece -->
    <main class="text-center">
        <h1 class="text-6xl md:text-8xl tracking-widest mb-4">DANNY.</h1>
        <p class="text-zinc-500 tracking-[0.3em] uppercase text-sm">Visual Storyteller</p>
    </main>

    <script>
        const menuBtn = document.getElementById('menu-btn');
        const mainMenu = document.getElementById('main-menu');

        menuBtn.addEventListener('click', () => {
            if (mainMenu.classList.contains('hidden')) {
                mainMenu.classList.remove('hidden');
                // Small delay to allow display:block to apply before animating opacity
                setTimeout(() => mainMenu.classList.remove('opacity-0'), 10);
                menuBtn.innerText = 'Close';
            } else {
                mainMenu.classList.add('opacity-0');
                setTimeout(() => mainMenu.classList.add('hidden'), 300);
                menuBtn.innerText = 'Menu';
            }
        });
    </script>
</body>
</html>
