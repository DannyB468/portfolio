<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="danny.png">
    <title>Danny's Visuals | Photography</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&display=swap" rel="stylesheet">
    <style> 
        body { font-family: 'Cormorant Garamond', serif; scroll-behavior: smooth; } 
        
        /* Hamburger Animation */
        .hamburger-active .bar-1 {
            transform: translateY(7px) rotate(45deg);
        }
        .hamburger-active .bar-2 {
            opacity: 0;
        }
        .hamburger-active .bar-3 {
            transform: translateY(-7px) rotate(-45deg);
        }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-50 antialiased min-h-screen relative">

    <!-- Header -->
    <header class="fixed top-0 w-full p-8 flex justify-between items-center z-50 bg-zinc-950/80 backdrop-blur-md border-b border-zinc-900/50">
        <a href="index.html" class="text-2xl tracking-widest uppercase">Danny.</a>

        <!-- Functional Hamburger Icon Button -->
        <button id="main-menu-btn" aria-label="Toggle Menu" class="relative p-2 focus:outline-none group tracking-widest text-sm uppercase">
            <div id="hamburger-icon" class="w-6 h-4 flex flex-col justify-between">
                <span class="bar-1 w-full h-[2px] bg-zinc-50 transition-all duration-300 origin-center"></span>
                <span class="bar-2 w-full h-[2px] bg-zinc-50 transition-all duration-300"></span>
                <span class="bar-3 w-full h-[2px] bg-zinc-50 transition-all duration-300 origin-center"></span>
            </div>
        </button>
    </header>

    <!-- Main Menu Overlay -->
    <div id="main-menu" class="fixed inset-0 bg-zinc-950/95 z-40 hidden flex-col justify-center items-center space-y-8 opacity-0 transition-opacity duration-300">
        <nav class="flex flex-col items-center space-y-6 text-center">
            <a href="index.html" class="text-3xl md:text-5xl tracking-widest uppercase text-zinc-400 hover:text-zinc-100 transition-colors">Home</a>
            <a href="photography.html" class="text-3xl md:text-5xl tracking-widest uppercase text-zinc-400 hover:text-zinc-100 transition-colors">Photography</a>
            <a href="videography.html" class="text-3xl md:text-5xl tracking-widest uppercase text-zinc-400 hover:text-zinc-100 transition-colors">Videography</a>
            <a href="about.html" class="text-3xl md:text-5xl tracking-widest uppercase text-zinc-400 hover:text-zinc-100 transition-colors">About</a>
        </nav>
    </div>

    <!-- Page Content -->
    <main class="pt-32 pb-20 px-8 max-w-7xl mx-auto">
        <!-- Section Header -->
        <div class="flex justify-center items-end mb-16 border-b border-zinc-800 pb-6 text-center">
            <h1 class="text-4xl md:text-5xl tracking-widest uppercase">Photography</h1>
        </div>
            
        <!-- Minimalist Image Grid -->
        <div id="image-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-12">
            <!-- Image 1 -->
            <div class="group">
                <img src="assets/photos/maroon1.webp" alt="Sunday Afternoon" class="w-full aspect-[3/4] object-cover grayscale group-hover:grayscale-0 transition-all duration-700">
                <p class="mt-4 text-sm tracking-widest text-zinc-400 uppercase">Sunday Afternoon / Chayamba</p>
            </div>
            <!-- Image 2 -->
            <div class="group">
                <img src="assets/photos/nike1.webp" alt="Swoosh" class="w-full aspect-[3/4] object-cover grayscale group-hover:grayscale-0 transition-all duration-700">
                <p class="mt-4 text-sm tracking-widest text-zinc-400 uppercase">Swoosh / WAMI</p>
            </div>
            <!-- Image 3 -->
            <div class="group">
                <img src="assets/photos/joy1.webp" alt="JOY" class="w-full aspect-[3/4] object-cover grayscale group-hover:grayscale-0 transition-all duration-700">
                <p class="mt-4 text-sm tracking-widest text-zinc-400 uppercase">JOY / KUHES</p>
            </div>
            
            <!-- 97 generated slots injected here via JS -->
        </div>
    </main>

    <!-- Back to Top Button -->
    <button id="back-to-top" aria-label="Back to top" class="fixed bottom-10 right-10 bg-zinc-50 text-zinc-950 p-4 rounded-full opacity-0 pointer-events-none transition-all duration-500 z-50 hover:bg-zinc-300 shadow-xl shadow-black/50 border border-transparent">
        <svg class="w-5 h-5 transition-transform duration-300 hover:-translate-y-1" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M5 10l7-7m0 0l7 7m-7-7v18"></path>
        </svg>
    </button>

    <script>
        // 1. Generate 97 extra grid slots (to reach 100 total)
        const imageGrid = document.getElementById('image-grid');
        for(let i = 4; i <= 100; i++) {
            const slot = document.createElement('div');
            slot.className = 'group';
            slot.innerHTML = `
                <div class="w-full aspect-[3/4] bg-zinc-900/50 flex flex-col items-center justify-center text-zinc-700 border border-zinc-800/50 grayscale group-hover:grayscale-0 group-hover:bg-zinc-900 transition-all duration-700">
                    <span class="tracking-widest uppercase text-xs mb-2">Slot ${i}</span>
                    <svg class="w-8 h-8 opacity-20" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                </div>
                <p class="mt-4 text-sm tracking-widest text-zinc-400 uppercase">Title ${i} / Location</p>
            `;
            imageGrid.appendChild(slot);
        }

        // 2. Main Menu Toggle Logic
        const mainBtn = document.getElementById('main-menu-btn');
        const mainMenu = document.getElementById('main-menu');
        const hamburgerIcon = document.getElementById('hamburger-icon');

        mainBtn.addEventListener('click', () => {
            if (mainMenu.classList.contains('hidden')) {
                mainMenu.classList.replace('hidden', 'flex'); 
                setTimeout(() => mainMenu.classList.remove('opacity-0'), 10);
                hamburgerIcon.classList.add('hamburger-active'); // Animates icon to "X"
            } else {
                mainMenu.classList.add('opacity-0');
                setTimeout(() => {
                    mainMenu.classList.replace('flex', 'hidden'); 
                }, 300);
                hamburgerIcon.classList.remove('hamburger-active'); // Reverts icon to hamburger
            }
        });

        // 3. Back to Top Button Logic
        const backToTopBtn = document.getElementById('back-to-top');

        window.addEventListener('scroll', () => {
            if (window.scrollY > 600) {
                backToTopBtn.classList.remove('opacity-0', 'pointer-events-none');
                backToTopBtn.classList.add('opacity-100', 'pointer-events-auto');
            } else {
                backToTopBtn.classList.remove('opacity-100', 'pointer-events-auto');
                backToTopBtn.classList.add('opacity-0', 'pointer-events-none');
            }
        });

        backToTopBtn.addEventListener('click', () => {
            window.scrollTo({
                top: 0,
                behavior: 'smooth'
            });
        });
    </script>
</body>
</html>
