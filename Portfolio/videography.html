<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="danny.png">
    <title>Danny's Visuals | Videography</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <style> 
        body { font-family: 'Geist Mono', monospace; } 
        
        /* Hamburger Animation */
        .hamburger-active .bar-1 {
            transform: translateY(7px) rotate(45deg);
        }
        .hamburger-active .bar-2 {
            opacity: 0;
        }
        .hamburger-active .bar-3 {
            transform: translateY(-7px) rotate(-45deg);
        }

        /* Optional: Add custom scrollbar for a cleaner look */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #09090b; }
        ::-webkit-scrollbar-thumb { background: #3f3f46; }

        .featured-video-frame {
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-50 antialiased min-h-screen">

    <!-- Header -->
    <header class="fixed top-0 w-full p-8 flex justify-between items-center z-50 bg-zinc-950/80 backdrop-blur-md border-b border-zinc-900/50">
        <a href="index.html" class="text-2xl tracking-widest uppercase">Danny.</a>

        <!-- Functional Hamburger Icon Button -->
        <button id="main-menu-btn" aria-label="Toggle Menu" class="relative p-2 focus:outline-none group">
            <div id="hamburger-icon" class="w-6 h-4 flex flex-col justify-between">
            <span class="bar-1 w-full h-[2px] bg-zinc-50 transition-all duration-300 origin-center"></span>
                <span class="bar-2 w-full h-[2px] bg-zinc-50 transition-all duration-300"></span>
            <span class="bar-3 w-full h-[2px] bg-zinc-50 transition-all duration-300 origin-center"></span>
            </div>
        </button>
    </header>

    <!-- Main Menu Overlay -->
    <div id="main-menu" class="fixed inset-0 bg-zinc-950/95 z-40 hidden flex-col justify-center items-center space-y-8 opacity-0 transition-opacity duration-300">
        <nav class="flex flex-col items-center space-y-6 text-center">
            <a href="index.html" class="text-3xl md:text-5xl tracking-widest uppercase text-zinc-400 hover:text-zinc-100 transition-colors">Home</a>
            <a href="photography.html" class="text-3xl md:text-5xl tracking-widest uppercase text-zinc-400 hover:text-zinc-100 transition-colors">Photography</a>
            <a href="videography.html" class="text-3xl md:text-5xl tracking-widest uppercase text-zinc-400 hover:text-zinc-100 transition-colors">Videography</a>
            <a href="about.html" class="text-3xl md:text-5xl tracking-widest uppercase text-zinc-400 hover:text-zinc-100 transition-colors">About</a>
        </nav>
    </div>

    <!-- Page Content -->
    <main class="pt-32 pb-20 px-8 max-w-7xl mx-auto">
        
        <!-- Section Header -->
        <div class="flex justify-center items-end mb-12 border-b border-zinc-800 pb-6 text-center">
            <h1 class="text-4xl md:text-5xl tracking-widest uppercase">Videography</h1>
        </div>
            
        <!-- Featured YouTube Video -->
        <div class="mb-20">
            <!-- aspect-video forces a 16:9 ratio -->
            <div class="w-full aspect-video bg-zinc-900 shadow-xl overflow-hidden">
                <iframe src="https://www.youtube.com/embed/HR6HUxRSL2g?si=4oFP31Wer9PeI0Dt" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen class="featured-video-frame"></iframe>
            </div>
            <p class="mt-4 text-sm tracking-widest text-zinc-400 uppercase">Chilomoni Fargo, Blantyre, Malawi</p>
        </div>

        <!-- Additional YouTube Videos -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-12">
            
            <!-- PMOTR -->
            <div class="group">
                <div class="w-full aspect-video bg-zinc-900 overflow-hidden relative">
                    <iframe src="https://www.youtube.com/embed/5XLFPSHTMgo" title="PMOTR" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen class="featured-video-frame"></iframe>
                </div>
                <p class="mt-4 text-sm tracking-widest text-zinc-400 uppercase">PMOTR | Elly B's, Chichiri Shopping Mall, Blantyre, Malawi</p>
            </div>

            <!-- WCAUAF -->
            <div class="group">
                <div class="w-full aspect-video bg-zinc-900 overflow-hidden relative">
                    <iframe src="https://www.youtube.com/embed/C8IjDQxD1Ns" title="WCAUAF" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen class="featured-video-frame"></iframe>
                </div>
                <p class="mt-4 text-sm tracking-widest text-zinc-400 uppercase">WCAUAF | Masauko Chipembere Highway, Blantyre, Malawi</p>
            </div>

            <!-- WH -->
            <div class="group">
                <div class="w-full aspect-video bg-zinc-900 overflow-hidden relative">
                    <iframe src="https://www.youtube.com/embed/r2rdSk7dpQA" title="WH" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen class="featured-video-frame"></iframe>
                </div>
                <p class="mt-4 text-sm tracking-widest text-zinc-400 uppercase">WH | Galaxy House, Blantyre CBD, Malawi</p>
            </div>

        </div>
    </main>

    <script>
        // Main Menu Logic
        const mainBtn = document.getElementById('main-menu-btn');
        const mainMenu = document.getElementById('main-menu');
        const hamburgerIcon = document.getElementById('hamburger-icon');
        
        mainBtn.addEventListener('click', () => {
            const isHidden = mainMenu.classList.contains('hidden');
            
            if (isHidden) {
                // Open menu
                mainMenu.classList.replace('hidden', 'flex');
                setTimeout(() => mainMenu.classList.remove('opacity-0'), 10);
                
                // Animate hamburger to X
                hamburgerIcon.classList.add('hamburger-active');
            } else {
                // Close menu
                mainMenu.classList.add('opacity-0');
                setTimeout(() => mainMenu.classList.replace('flex', 'hidden'), 300);
                
                // Revert X to hamburger
                hamburgerIcon.classList.remove('hamburger-active');
            }
        });
    </script>
</body>
</html>
