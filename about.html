<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="danny.png">
    <title>About | Danny.</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&display=swap" rel="stylesheet">
    <style> body { font-family: 'Cormorant Garamond', serif; } </style>
</head>
<body class="bg-zinc-950 text-zinc-50 antialiased h-screen flex flex-col">

    <!-- Header -->
    <header class="w-full p-8 flex justify-between items-center z-50">
        <a href="index.html" class="text-2xl tracking-widest uppercase">Danny.</a>
        <button id="main-menu-btn" class="text-lg tracking-widest uppercase hover:text-zinc-400 transition-colors">Menu</button>
    </header>

    <!-- Main Menu Overlay -->
    <div id="main-menu" class="fixed inset-0 bg-zinc-950/95 z-40 hidden flex-col justify-center items-center space-y-8 opacity-0 transition-opacity duration-300">
        <a href="photography.html" class="text-4xl md:text-6xl tracking-widest hover:text-zinc-400">Photography</a>
        <a href="videography.html" class="text-4xl md:text-6xl tracking-widest hover:text-zinc-400">Videography</a>
        <a href="about.html" class="text-4xl md:text-6xl tracking-widest text-zinc-500">About</a>
    </div>

    <!-- Main Content: Paragraph -->
    <main class="flex-grow flex items-center justify-center px-8 max-w-3xl mx-auto text-center">
        <p class="text-2xl md:text-4xl leading-relaxed font-light text-zinc-300">
            If you have a story to tell, a product to showcase, or an event to capture, I would love to collaborate with you. Let's create visuals that resonate and leave a lasting impression.
        </p>
    </main>

    <!-- Footer: Contact Details -->
    <footer class="p-8 w-full border-t border-zinc-900 flex flex-col md:flex-row justify-between items-center text-sm tracking-[0.2em] uppercase text-zinc-500 space-y-4 md:space-y-0">
        <a href="mailto:danielbvalani@gmail.com" class="hover:text-zinc-300 transition-colors">danielbvalani@gmail.com</a>
        <a href="tel:+265999025468" class="hover:text-zinc-300 transition-colors">+265 999 025 468</a>
        <span>Blantyre, MW</span>
    </footer>

    <script>
        const mainBtn = document.getElementById('main-menu-btn');
        const mainMenu = document.getElementById('main-menu');
        mainBtn.addEventListener('click', () => {
            if (mainMenu.classList.contains('hidden')) {
                mainMenu.classList.remove('hidden');
                setTimeout(() => mainMenu.classList.remove('opacity-0'), 10);
                mainBtn.innerText = 'Close';
            } else {
                mainMenu.classList.add('opacity-0');
                setTimeout(() => mainMenu.classList.add('hidden'), 300);
                mainBtn.innerText = 'Menu';
            }
        });
    </script>
</body>
</html>
